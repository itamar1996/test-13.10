openapi: 3.0.0
info:
  title: מערכת ניהול ציונים API
  version: 1.0.0
  description: API לניהול משתמשים, תלמידים, מורים וציונים

servers:
  - url: http://localhost:3001/api

tags:
  - name: Auth
    description: פעולות אימות
  - name: Student
    description: פעולות הקשורות לתלמידים
  - name: Teacher
    description: פעולות הקשורות למורים
  - name: Grades
    description: פעולות הקשורות לציונים

paths:
  /auth/login:
    post:
      summary: אימות משתמש
      tags: 
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "john_doe"
                password:
                  type: string
                  example: "secure_password123"
      responses:
        '200':
          description: אימות הצליח
        '400':
          description: פרטי התחברות לא תקינים

  /auth/logout:
    delete:
      summary: התנתקות משתמש
      tags: 
        - Auth
      responses:
        '200':
          description: התנתקות הצליחה
        '500':
          description: שגיאת שרת במהלך ההתנתקות

  /student:
    post:
      summary: רישום תלמיד
      tags: 
        - Student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - classname
              properties:
                username:
                  type: string
                  example: "student1"
                email:
                  type: string
                  example: "student1@example.com"
                password:
                  type: string
                  example: "securepass123"
                classname:
                  type: string
                  example: "Class A"
      responses:
        '200':
          description: תלמיד נרשם בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: נתוני קלט לא תקינים

  /teacher:
    post:
      summary: רישום מורה
      tags: 
        - Teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - classname
              properties:
                username:
                  type: string
                  example: "teacher1"
                email:
                  type: string
                  example: "teacher1@example.com"
                password:
                  type: string
                  example: "securepass456"
                classname:
                  type: string
                  example: "Class B"
      responses:
        '200':
          description: מורה נרשם בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: נתוני קלט לא תקינים

  /teacher/grades/avg:
    get:
      summary: קבלת ציון ממוצע למורה
      tags: 
        - Teacher
        - Grades
      responses:
        '200':
          description: ציון ממוצע התקבל בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  averageGrade:
                    type: number
                    example: 85.5
        '400':
          description: נתוני קלט לא תקינים

  /teacher/grades/{id}:
    get:
      summary: קבלת ציון לפי מזהה תלמיד
      tags: 
        - Teacher
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: מזהה מספרי של תלמיד
          example: "12345"
      responses:
        '200':
          description: תלמיד נמצא בהצלחה
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
                  classname:
                    type: string
        '400':
          description: נתוני קלט לא תקינים

  /teacher/grades:
    post:
      summary: הוספת ציון לתלמיד
      tags: 
        - Teacher
        - Grades
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
                - testName
                - grade
              properties:
                studentId:
                  type: string
                  example: "54321"
                testName:
                  type: string
                  example: "מבחן אמצע סמסטר"
                grade:
                  type: number
                  example: 92
      responses:
        '200':
          description: ציון נוסף בהצלחה
        '400':
          description: נתוני קלט לא תקינים
        '404':
          description: תלמיד לא נמצא

    get:
      summary: קבלת ציונים עבור כיתה
      tags: 
        - Teacher
        - Grades
      responses:
        '200':
          description: ציונים התקבלו בהצלחה
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    studentId:
                      type: string
                    testName:
                      type: string
                    grade:
                      type: number
        '400':
          description: נתוני קלט לא תקינים